<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Камера</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#000;color:#fff;
  font-family:-apple-system,system-ui,sans-serif;user-select:none}
#app{position:fixed;inset:0}
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
#video.mirrored{transform:scaleX(-1)}

.btn{background:rgba(255,255,255,.15);border:none;color:#fff;border-radius:50%;
  width:52px;height:52px;display:flex;align-items:center;justify-content:center;
  font-size:22px;cursor:pointer;backdrop-filter:blur(10px);position:relative}
.btn.active{background:#ffd60a;color:#000;box-shadow:0 0 18px rgba(255,214,10,.55)}
.btn.disabled{opacity:.35}

#topbar{position:absolute;top:0;left:0;right:0;z-index:20;
  padding:calc(12px + env(safe-area-inset-top)) 14px 12px;
  display:flex;justify-content:flex-end;gap:10px;
  background:linear-gradient(to bottom,rgba(0,0,0,.55),transparent)}
#topbar .btn{width:48px;height:48px;font-size:20px}
#burstBtn{font-size:14px;font-weight:700}

#controls{position:absolute;bottom:0;left:0;right:0;z-index:20;
  padding:20px 24px calc(20px + env(safe-area-inset-bottom));
  display:flex;align-items:center;justify-content:space-between;
  background:linear-gradient(to top,rgba(0,0,0,.7),transparent)}

#captureBtn{width:76px;height:76px;background:rgba(255,255,255,.25);
  border:4px solid #fff;border-radius:50%;padding:0;display:flex;
  align-items:center;justify-content:center;cursor:pointer}
#captureBtn .inner{width:60px;height:60px;border-radius:50%;background:#fff;
  transition:all .2s}
#captureBtn.recording .inner{border-radius:8px;width:30px;height:30px;background:#ff3b30}

#galleryThumb{width:52px;height:52px;border-radius:12px;background:#222 center/cover no-repeat;
  border:2px solid rgba(255,255,255,.3);cursor:pointer}

.recTimer{position:absolute;top:calc(60px + env(safe-area-inset-top));left:50%;
  transform:translateX(-50%);background:rgba(255,0,0,.85);padding:4px 12px;
  border-radius:20px;font-size:13px;font-weight:bold;z-index:25;display:none}
.recTimer.active{display:block}

#blackScreen{position:absolute;inset:0;background:#000;z-index:100;
  display:none;align-items:center;justify-content:center;cursor:pointer;
  touch-action:none}
#blackScreen.active{display:flex}
#blackScreen .hint{color:#161616;font-size:13px;text-align:center;
  line-height:1.7;padding:20px;pointer-events:none}

/* Подсказка-«ручка» для свайпа у правого края */
#blackScreen .swipeHandle{position:absolute;right:2px;top:50%;
  transform:translateY(-50%);width:3px;height:70px;border-radius:2px;
  background:#141414;pointer-events:none}

#gallery{position:absolute;inset:0;z-index:200;background:#000;
  display:none;flex-direction:column}
#gallery.active{display:flex}
#galleryHeader{padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
  display:flex;align-items:center;gap:12px;border-bottom:1px solid #1a1a1a}
#galleryHeader h2{margin:0;font-size:18px;flex:1}
#galleryGrid{flex:1;overflow-y:auto;display:grid;
  grid-template-columns:repeat(3,1fr);gap:2px;padding:2px}
.gitem{position:relative;aspect-ratio:1;background:#111;overflow:hidden;cursor:pointer}
.gitem img,.gitem video{width:100%;height:100%;object-fit:cover;display:block}
.gitem .badge{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.6);
  padding:2px 6px;border-radius:4px;font-size:10px}

#preview{position:absolute;inset:0;z-index:300;background:#000;
  display:none;flex-direction:column}
#preview.active{display:flex}
#previewContent{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden}
#previewContent img,#previewContent video{max-width:100%;max-height:100%}
#previewActions{padding:16px calc(16px + env(safe-area-inset-bottom));
  display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
#previewActions button{background:rgba(255,255,255,.15);border:none;color:#fff;
  padding:12px 16px;border-radius:10px;font-size:14px;cursor:pointer}
#previewActions button.primary{background:#0a84ff}

#settings{position:absolute;inset:0;z-index:400;background:rgba(0,0,0,.97);
  display:none;flex-direction:column}
#settings.active{display:flex}
#settingsHeader{padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
  display:flex;align-items:center;gap:12px;border-bottom:1px solid #1a1a1a}
#settingsHeader h2{margin:0;font-size:18px;flex:1}
#settingsBody{flex:1;overflow-y:auto;padding:8px 16px 40px}
.setting-row{padding:18px 0;border-bottom:1px solid #1a1a1a}
.setting-row label{display:block;font-size:13px;color:#8a8a8a;margin-bottom:12px;
  text-transform:uppercase;letter-spacing:.5px}
.setting-row input[type=range]{width:100%;accent-color:#0a84ff;height:6px}
.setting-hint{margin-top:8px;font-size:14px;color:#fff;line-height:1.5}
.setting-hint b{color:#0a84ff}
.setting-hint .warn{color:#ff9f0a;font-size:13px}
.radio-group{display:flex;gap:8px;flex-wrap:wrap}
.radio-group button{flex:1;min-width:90px;padding:12px 8px;border-radius:10px;
  border:2px solid #2a2a2a;background:#0e0e0e;color:#fff;font-size:14px;cursor:pointer}
.radio-group button.active{border-color:#0a84ff;background:rgba(10,132,255,.18)}
.radio-group button.disabled{opacity:.35}

#toast{position:absolute;bottom:130px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,.85);color:#fff;padding:10px 18px;border-radius:20px;
  font-size:14px;z-index:500;opacity:0;transition:opacity .3s;
  pointer-events:none;white-space:nowrap;max-width:90vw;overflow:hidden}
#toast.show{opacity:1}
</style>
</head>
<body>
<div id="app">
  <video id="video" autoplay playsinline muted></video>

  <div class="recTimer" id="recTimer">00:00</div>

  <div id="topbar">
    <button class="btn" id="burstBtn" title="Серия снимков">1×</button>
    <button class="btn" id="flipBtn" title="Сменить камеру">🔄</button>
    <button class="btn" id="settingsBtn" title="Настройки">⚙</button>
    <button class="btn" id="blackBtn" title="Чёрный экран">🌙</button>
  </div>

  <div id="controls">
    <div id="galleryThumb"></div>
    <button id="captureBtn"><div class="inner"></div></button>
    <button class="btn" id="modeBtn" title="Видео">📹</button>
  </div>

  <div id="blackScreen">
    <div class="swipeHandle"></div>
    <div class="hint">
      удержание — снимок<br>
      свайп от правого края влево — выйти
    </div>
  </div>

  <div id="gallery">
    <div id="galleryHeader">
      <button class="btn" id="closeGallery">←</button>
      <h2>Моя галерея</h2>
    </div>
    <div id="galleryGrid"></div>
  </div>

  <div id="preview">
    <div id="previewContent"></div>
    <div id="previewActions">
      <button class="primary" id="saveBtn">⬇ В системную</button>
      <button id="shareBtn">↗ Поделиться</button>
      <button id="deleteBtn">🗑 Удалить</button>
      <button id="closePreview">✕</button>
    </div>
  </div>

  <div id="settings">
    <div id="settingsHeader">
      <button class="btn" id="closeSettings">←</button>
      <h2>Настройки</h2>
    </div>
    <div id="settingsBody">

      <div class="setting-row">
        <label>Серия снимков</label>
        <input type="range" id="burstRange" min="1" max="9" step="1">
        <div class="setting-hint">Снимать <b id="burstValue">1</b> фото за раз</div>
      </div>

      <div class="setting-row">
        <label>Авто-вспышка при снимке</label>
        <div class="radio-group" id="torchGroup">
          <button data-value="on">Вкл</button>
          <button data-value="off">Выкл</button>
        </div>
        <div class="setting-hint" id="torchHint"></div>
      </div>

      <div class="setting-row">
        <label>Время вспышки на один кадр</label>
        <input type="range" id="torchDurRange" min="100" max="1500" step="50">
        <div class="setting-hint">Держать вспышку <b id="torchDurValue">300 мс</b> на кадр</div>
        <div class="setting-hint">Для серии из <b id="torchDurBurst">1</b> фото — всего <b id="torchDurTotal">300 мс</b></div>
      </div>

      <div class="setting-row">
        <label>Длительность удержания чёрного экрана</label>
        <input type="range" id="holdRange" min="200" max="3000" step="100">
        <div class="setting-hint">Удерживать <b id="holdValue">800 мс</b></div>
      </div>

      <div class="setting-row">
        <label>Что делать при удержании</label>
        <div class="radio-group" id="holdActionGroup">
          <button data-value="current">Текущий режим</button>
          <button data-value="photo">Фото</button>
          <button data-value="video">Видео</button>
        </div>
      </div>

      <div class="setting-row">
        <label>Вибро-отклик</label>
        <div class="radio-group" id="vibroGroup">
          <button data-value="on">Вкл</button>
          <button data-value="off">Выкл</button>
        </div>
      </div>

    </div>
  </div>

  <div id="toast"></div>
</div>

<script>
(function(){
'use strict';

/* ================= Settings ================= */
const SETTINGS_KEY='camapp_settings_v3';
const SETTINGS_DEFAULTS={
  holdMs:800,
  holdAction:'current',
  vibro:true,
  burstCount:1,
  torchAuto:false,
  torchDurMs:300
};
let settings={...SETTINGS_DEFAULTS};
function loadSettings(){
  try{
    const raw=localStorage.getItem(SETTINGS_KEY);
    if(raw) settings={...SETTINGS_DEFAULTS, ...JSON.parse(raw)};
  }catch(e){}
}
function persistSettings(){
  try{ localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); }catch(e){}
}

/* ================= IndexedDB ================= */
const DB_NAME='camapp', STORE='media';
function openDB(){
  return new Promise((res,rej)=>{
    const r=indexedDB.open(DB_NAME,1);
    r.onupgradeneeded=e=>{
      const db=e.target.result;
      if(!db.objectStoreNames.contains(STORE))
        db.createObjectStore(STORE,{keyPath:'id',autoIncrement:true});
    };
    r.onsuccess=e=>res(e.target.result);
    r.onerror=e=>rej(e.target.error);
  });
}
async function dbAdd(item){
  const db=await openDB();
  return new Promise((res,rej)=>{
    const tx=db.transaction(STORE,'readwrite');
    const r=tx.objectStore(STORE).add(item);
    r.onsuccess=()=>res(r.result);
    r.onerror=()=>rej(r.error);
  });
}
async function dbAll(){
  const db=await openDB();
  return new Promise((res,rej)=>{
    const tx=db.transaction(STORE,'readonly');
    const r=tx.objectStore(STORE).getAll();
    r.onsuccess=()=>res(r.result);
    r.onerror=()=>rej(r.error);
  });
}
async function dbGet(id){
  const db=await openDB();
  return new Promise((res,rej)=>{
    const tx=db.transaction(STORE,'readonly');
    const r=tx.objectStore(STORE).get(id);
    r.onsuccess=()=>res(r.result);
    r.onerror=()=>rej(r.error);
  });
}
async function dbDel(id){
  const db=await openDB();
  return new Promise((res,rej)=>{
    const tx=db.transaction(STORE,'readwrite');
    const r=tx.objectStore(STORE).delete(id);
    r.onsuccess=()=>res();
    r.onerror=()=>rej(r.error);
  });
}

/* ================= Toast ================= */
let toastTimer;
function toast(msg){
  if(document.getElementById('blackScreen').classList.contains('active')) return;
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),2200);
}

/* ================= Camera ================= */
const video=document.getElementById('video');
let stream=null;
let facing='environment';
let mode='photo';
let mediaRecorder=null;
let chunks=[];
let recording=false;
let recStart=0;
let recInterval=null;
let torchSupported=false;

async function initStream(){
  if(!window.isSecureContext){
    console.warn('isSecureContext = false. Origin:', location.origin);
  }
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    toast('Браузер не поддерживает камеру');
    return;
  }
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
  const base={facingMode:{ideal:facing},width:{ideal:1280},height:{ideal:720}};
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:base,audio:true});
  }catch(e){
    try{
      stream=await navigator.mediaDevices.getUserMedia({video:base});
    }catch(e2){
      let msg='Камера недоступна';
      if(e2.name==='NotAllowedError') msg='Доступ к камере запрещён';
      else if(e2.name==='NotFoundError') msg='Камера не найдена';
      else if(e2.name==='NotReadableError') msg='Камеру занимает другое приложение';
      else if(e2.name==='SecurityError'||!window.isSecureContext) msg='Нужен HTTPS или localhost';
      toast(msg+' ('+e2.name+')');
      return;
    }
  }
  video.srcObject=stream;
  video.classList.toggle('mirrored',facing==='user');
  try{ await video.play(); }catch(e){}

  // Определяем поддержку вспышки
  const track=stream.getVideoTracks()[0];
  let caps={};
  try{ caps=track.getCapabilities ? track.getCapabilities() : {}; }catch(e){}
  torchSupported = !!caps.torch;

  updateTorchUI();
}

/* ================= Torch helpers ================= */
async function torchOnNow(){
  if(!stream) return false;
  const track=stream.getVideoTracks()[0];
  if(!track) return false;
  try{
    await track.applyConstraints({advanced:[{torch:true}]});
    return true;
  }catch(e){
    console.warn('torch on fail', e);
    return false;
  }
}
async function torchOffNow(){
  if(!stream) return;
  const track=stream.getVideoTracks()[0];
  if(!track) return;
  try{
    await track.applyConstraints({advanced:[{torch:false}]});
  }catch(e){
    console.warn('torch off fail', e);
  }
}

function updateTorchUI(){
  document.querySelectorAll('#torchGroup button').forEach(b=>{
    const v = b.dataset.value==='on';
    b.classList.toggle('active', v===settings.torchAuto);
    b.classList.toggle('disabled', !torchSupported);
  });
  const hint = document.getElementById('torchHint');
  if(!hint) return;
  if(torchSupported){
    hint.innerHTML = 'LED-вспышка доступна на этой камере.';
  }else{
    hint.innerHTML = '<span class="warn">Вспышка недоступна на этой камере или в этом браузере.</span>';
  }
}

/* ================= Photo / Burst ================= */
async function captureBurst(count, opts){
  const silent = !!(opts && opts.silent);
  count = Math.max(1, Math.min(9, count|0));
  let saved=0;

  const track = stream ? stream.getVideoTracks()[0] : null;
  const useTorch = settings.torchAuto && torchSupported && track;
  let torchStartTime = 0;
  let torchActive = false;

  if(useTorch){
    torchActive = await torchOnNow();
    if(torchActive){
      torchStartTime = Date.now();
      // небольшая пауза, чтобы авто-экспозиция подстроилась под свет
      await new Promise(r=>setTimeout(r, 180));
    }
  }

  try{
    for(let i=0;i<count;i++){
      if(!video.videoWidth){
        if(!silent) toast('Камера ещё не готова');
        break;
      }
      const c=document.createElement('canvas');
      c.width=video.videoWidth; c.height=video.videoHeight;
      c.getContext('2d').drawImage(video,0,0);
      const blob = await new Promise(res=>c.toBlob(res,'image/jpeg',0.92));
      if(!blob) break;

      await dbAdd({blob,type:'photo',mime:'image/jpeg',date:Date.now()});
      saved++;

      if(i<count-1) await new Promise(r=>setTimeout(r,120));
    }
  } finally {
    if(torchActive){
      // Держим вспышку как минимум count*torchDurMs от момента включения
      const elapsed = Date.now() - torchStartTime;
      const targetMs = count * settings.torchDurMs;
      const remaining = Math.max(0, targetMs - elapsed);
      if(remaining>0) await new Promise(r=>setTimeout(r, remaining));
      await torchOffNow();
    }
  }

  await updateThumb();

  if(!silent){
    if(saved>0) flash();
    if(saved===1) toast('Снимок сохранён в галерею');
    else if(saved>1) toast('Сохранено '+saved+' снимков');
    else toast('Не удалось сохранить');
  }
  return saved;
}

function flash(){
  const f=document.createElement('div');
  f.style.cssText='position:absolute;inset:0;background:#fff;z-index:50;pointer-events:none;opacity:.9;transition:opacity .25s';
  document.getElementById('app').appendChild(f);
  requestAnimationFrame(()=>{f.style.opacity='0';setTimeout(()=>f.remove(),300);});
}

/* ================= Video ================= */
function pickMime(){
  const list=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus',
    'video/webm','video/mp4;codecs=h264,aac','video/mp4'];
  for(const m of list) if(window.MediaRecorder && MediaRecorder.isTypeSupported(m)) return m;
  return '';
}
function startRecording(){
  if(!stream){ toast('Нет потока'); return; }
  chunks=[];
  const mime=pickMime();
  try{
    mediaRecorder=mime?new MediaRecorder(stream,{mimeType:mime}):new MediaRecorder(stream);
  }catch(e){ toast('Запись не поддерживается'); return; }
  mediaRecorder.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
  mediaRecorder.onstop=async()=>{
    const blob=new Blob(chunks,{type:mediaRecorder.mimeType||'video/webm'});
    await dbAdd({blob,type:'video',mime:blob.type,date:Date.now()});
    updateThumb();
    toast('Видео сохранено в галерею');
  };
  mediaRecorder.start();
  recording=true;
  recStart=Date.now();
  recInterval=setInterval(updateRecTimer,250);
  document.getElementById('recTimer').classList.add('active');
  document.getElementById('captureBtn').classList.add('recording');
}
function stopRecording(){
  if(mediaRecorder&&mediaRecorder.state!=='inactive')mediaRecorder.stop();
  recording=false;
  clearInterval(recInterval);
  document.getElementById('recTimer').classList.remove('active');
  document.getElementById('captureBtn').classList.remove('recording');
}
function updateRecTimer(){
  const s=Math.floor((Date.now()-recStart)/1000);
  const m=String(Math.floor(s/60)).padStart(2,'0');
  const ss=String(s%60).padStart(2,'0');
  document.getElementById('recTimer').textContent=m+':'+ss;
}

/* ================= Thumb ================= */
let thumbUrl=null;
async function updateThumb(){
  const all=await dbAll();
  const th=document.getElementById('galleryThumb');
  if(!all.length){ th.style.backgroundImage=''; return; }
  all.sort((a,b)=>b.date-a.date);
  const it=all[0];
  if(thumbUrl) URL.revokeObjectURL(thumbUrl);
  thumbUrl=URL.createObjectURL(it.blob);
  if(it.type==='photo'){
    th.style.backgroundImage=`url(${thumbUrl})`;
  }else{
    const v=document.createElement('video');
    v.src=thumbUrl; v.muted=true; v.playsInline=true;
    v.addEventListener('loadeddata',()=>{ v.currentTime=Math.min(0.1,v.duration||0.1); });
    v.addEventListener('seeked',()=>{
      const c=document.createElement('canvas');
      c.width=v.videoWidth; c.height=v.videoHeight;
      c.getContext('2d').drawImage(v,0,0);
      th.style.backgroundImage=`url(${c.toDataURL('image/jpeg',0.7)})`;
    });
  }
}

/* ================= Gallery ================= */
let objectUrls=[];
async function openGallery(){
  const items=await dbAll();
  items.sort((a,b)=>b.date-a.date);
  objectUrls.forEach(u=>URL.revokeObjectURL(u));
  objectUrls=[];
  const grid=document.getElementById('galleryGrid');
  grid.innerHTML='';
  if(!items.length){
    grid.innerHTML='<div style="grid-column:1/-1;padding:50px;text-align:center;color:#555;font-size:14px">Здесь пока пусто<br>Сделайте первый снимок</div>';
  }
  for(const it of items){
    const url=URL.createObjectURL(it.blob);
    objectUrls.push(url);
    const d=document.createElement('div');
    d.className='gitem';
    if(it.type==='photo'){
      d.innerHTML='<img src="'+url+'" alt=""><span class="badge">📷</span>';
    }else{
      d.innerHTML='<video src="'+url+'" muted playsinline preload="metadata"></video><span class="badge">🎬</span>';
    }
    d.onclick=()=>openPreview(it.id,url);
    grid.appendChild(d);
  }
  document.getElementById('gallery').classList.add('active');
}

let previewId=null;
async function openPreview(id,url){
  previewId=id;
  const item=await dbGet(id);
  if(!item) return;
  const c=document.getElementById('previewContent');
  c.innerHTML='';
  if(item.type==='photo'){
    const img=document.createElement('img'); img.src=url; c.appendChild(img);
  }else{
    const v=document.createElement('video');
    v.src=url; v.controls=true; v.autoplay=true; v.playsInline=true;
    c.appendChild(v);
  }
  document.getElementById('preview').classList.add('active');
}
function closePreview(){
  document.getElementById('preview').classList.remove('active');
  document.getElementById('previewContent').innerHTML='';
  previewId=null;
}
function extFor(item){
  if(item.type==='photo') return 'jpg';
  if((item.mime||'').includes('mp4')) return 'mp4';
  return 'webm';
}
function fileName(item){
  const d=new Date(item.date);
  const pad=n=>String(n).padStart(2,'0');
  const stamp=d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'_'+
    pad(d.getHours())+pad(d.getMinutes())+pad(d.getSeconds());
  return (item.type==='photo'?'IMG_':'VID_')+stamp+'.'+extFor(item);
}
async function saveToSystem(){
  if(!previewId) return;
  const item=await dbGet(previewId);
  if(!item) return;
  const url=URL.createObjectURL(item.blob);
  const a=document.createElement('a');
  a.href=url; a.download=fileName(item);
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),8000);
  toast('Сохранено в Загрузки / системную галерею');
}
async function shareItem(){
  if(!previewId) return;
  const item=await dbGet(previewId);
  if(!item) return;
  const file=new File([item.blob],fileName(item),{type:item.mime||'application/octet-stream'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file]}); return; }catch(e){}
  }
  saveToSystem();
}
async function deleteItem(){
  if(!previewId) return;
  if(!confirm('Удалить файл?')) return;
  await dbDel(previewId);
  closePreview();
  openGallery();
  updateThumb();
  toast('Удалено');
}

/* ================= Black screen ================= */
let wakeLock=null;
async function requestWake(){
  try{
    if('wakeLock' in navigator) wakeLock=await navigator.wakeLock.request('screen');
  }catch(e){}
}
function releaseWake(){
  if(wakeLock){wakeLock.release().catch(()=>{});wakeLock=null;}
}
function toggleBlack(on){
  const el=document.getElementById('blackScreen');
  if(on){
    el.classList.add('active');
    requestWake();
  }else{
    el.classList.remove('active');
    releaseWake();
  }
}

/* --- Жесты на чёрном экране --- */
const blackEl=document.getElementById('blackScreen');
let holdTimer=null;
let holdFired=false;
let holdStartAt=0;
let swipeMode=false;
let swipeStartX=0;
let swipeStartY=0;
const SWIPE_EDGE = 70;   // зона правого края, где начинается свайп
const SWIPE_DIST = 80;   // минимальный сдвиг влево

function runHoldAction(){
  const act = settings.holdAction==='current' ? mode : settings.holdAction;
  if(act==='photo'){
    captureBurst(settings.burstCount, {silent:true}).then(c=>holdFeedback(c));
  }else if(act==='video'){
    recording ? stopRecording() : startRecording();
    holdFeedback(1);
  }
}
function holdFeedback(count){
  if(settings.vibro && navigator.vibrate){
    if(recording) navigator.vibrate([20,50,20]);
    else if(count && count>1) navigator.vibrate([15,40,15]);
    else navigator.vibrate(25);
  }
  const d=document.createElement('div');
  d.style.cssText='position:absolute;top:50%;left:50%;width:6px;height:6px;'+
    'margin:-3px;border-radius:50%;background:#1a1a1a;z-index:150;pointer-events:none;'+
    'transition:opacity .5s';
  document.getElementById('app').appendChild(d);
  requestAnimationFrame(()=>{ d.style.opacity='0'; });
  setTimeout(()=>d.remove(),600);
}

blackEl.addEventListener('pointerdown',e=>{
  const rect = blackEl.getBoundingClientRect();
  const fromRightEdge = (e.clientX > rect.right - SWIPE_EDGE);

  if(fromRightEdge){
    // Начинаем свайп-жест, long-press не активируем
    swipeMode = true;
    swipeStartX = e.clientX;
    swipeStartY = e.clientY;
    return;
  }

  // Обычный long-press для снимка
  e.preventDefault();
  swipeMode = false;
  holdFired = false;
  holdStartAt = Date.now();
  clearTimeout(holdTimer);
  holdTimer = setTimeout(()=>{
    holdFired = true;
    runHoldAction();
  }, settings.holdMs);
});

blackEl.addEventListener('pointermove',e=>{
  if(!swipeMode) return;
  const dx = e.clientX - swipeStartX;
  const dy = e.clientY - swipeStartY;
  if(dx < -SWIPE_DIST && Math.abs(dx) > Math.abs(dy)*1.2){
    swipeMode = false;
    clearTimeout(holdTimer);
    toggleBlack(false);
    if(settings.vibro && navigator.vibrate) navigator.vibrate(15);
  }
});

function endPress(){
  clearTimeout(holdTimer);
  if(swipeMode){
    swipeMode = false;
  }
  // Тап больше не выходит из чёрного экрана — только свайп
}
blackEl.addEventListener('pointerup',endPress);
blackEl.addEventListener('pointercancel',()=>{clearTimeout(holdTimer); swipeMode=false;});
blackEl.addEventListener('pointerleave',()=>{clearTimeout(holdTimer); swipeMode=false;});
blackEl.addEventListener('contextmenu',e=>e.preventDefault());

/* ================= Settings UI ================= */
function updateTorchDurTotal(){
  const total = settings.burstCount * settings.torchDurMs;
  const b = document.getElementById('torchDurBurst');
  const t = document.getElementById('torchDurTotal');
  if(b) b.textContent = settings.burstCount;
  if(t) t.textContent = total + ' мс';
}

function openSettings(){
  document.getElementById('holdRange').value=settings.holdMs;
  document.getElementById('holdValue').textContent=settings.holdMs+' мс';

  document.getElementById('burstRange').value=settings.burstCount;
  document.getElementById('burstValue').textContent=settings.burstCount;

  document.getElementById('torchDurRange').value=settings.torchDurMs;
  document.getElementById('torchDurValue').textContent=settings.torchDurMs+' мс';
  updateTorchDurTotal();

  document.querySelectorAll('#holdActionGroup button').forEach(b=>{
    b.classList.toggle('active', b.dataset.value===settings.holdAction);
  });
  document.querySelectorAll('#vibroGroup button').forEach(b=>{
    const v = b.dataset.value==='on';
    b.classList.toggle('active', v===settings.vibro);
  });

  updateTorchUI();
  document.getElementById('settings').classList.add('active');
}
document.getElementById('holdRange').addEventListener('input',e=>{
  settings.holdMs=parseInt(e.target.value,10);
  document.getElementById('holdValue').textContent=settings.holdMs+' мс';
  persistSettings();
});
document.getElementById('burstRange').addEventListener('input',e=>{
  settings.burstCount=parseInt(e.target.value,10);
  document.getElementById('burstValue').textContent=settings.burstCount;
  document.getElementById('burstBtn').textContent=settings.burstCount+'×';
  updateTorchDurTotal();
  persistSettings();
});
document.getElementById('torchDurRange').addEventListener('input',e=>{
  settings.torchDurMs=parseInt(e.target.value,10);
  document.getElementById('torchDurValue').textContent=settings.torchDurMs+' мс';
  updateTorchDurTotal();
  persistSettings();
});
document.querySelectorAll('#holdActionGroup button').forEach(b=>{
  b.onclick=()=>{
    settings.holdAction=b.dataset.value;
    persistSettings();
    document.querySelectorAll('#holdActionGroup button').forEach(x=>
      x.classList.toggle('active', x===b));
  };
});
document.querySelectorAll('#vibroGroup button').forEach(b=>{
  b.onclick=()=>{
    settings.vibro = b.dataset.value==='on';
    persistSettings();
    document.querySelectorAll('#vibroGroup button').forEach(x=>
      x.classList.toggle('active', x===b));
  };
});
document.querySelectorAll('#torchGroup button').forEach(b=>{
  b.onclick=()=>{
    if(!torchSupported && b.dataset.value==='on'){
      toast('Вспышка недоступна на этой камере');
      return;
    }
    settings.torchAuto = b.dataset.value==='on';
    persistSettings();
    updateTorchUI();
  };
});

/* ================= Events ================= */
document.getElementById('captureBtn').onclick=()=>{
  if(mode==='photo') captureBurst(1);
  else recording?stopRecording():startRecording();
};
document.getElementById('modeBtn').onclick=()=>{
  if(recording){ toast('Остановите запись'); return; }
  mode = mode==='photo'?'video':'photo';
  const b=document.getElementById('modeBtn');
  b.textContent = mode==='photo'?'📹':'📷';
  b.title = mode==='photo'?'Видео':'Фото';
  toast(mode==='photo'?'Режим: фото':'Режим: видео');
};
document.getElementById('burstBtn').onclick=()=>{
  if(mode!=='photo'){
    toast('Серия работает только в режиме фото');
    return;
  }
  captureBurst(settings.burstCount);
};
document.getElementById('flipBtn').onclick=async()=>{
  if(recording){ toast('Остановите запись'); return; }
  facing = facing==='environment'?'user':'environment';
  await initStream();
};
document.getElementById('blackBtn').onclick=()=>toggleBlack(true);
document.getElementById('settingsBtn').onclick=openSettings;
document.getElementById('closeSettings').onclick=()=>{
  document.getElementById('settings').classList.remove('active');
};
document.getElementById('galleryThumb').onclick=openGallery;
document.getElementById('closeGallery').onclick=()=>{
  document.getElementById('gallery').classList.remove('active');
  objectUrls.forEach(u=>URL.revokeObjectURL(u));
  objectUrls=[];
};
document.getElementById('closePreview').onclick=closePreview;
document.getElementById('saveBtn').onclick=saveToSystem;
document.getElementById('shareBtn').onclick=shareItem;
document.getElementById('deleteBtn').onclick=deleteItem;

document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible' && stream){
    const t=stream.getVideoTracks()[0];
    if(t && t.readyState==='ended') initStream();
  }
});
window.addEventListener('beforeunload',()=>{
  if(stream) stream.getTracks().forEach(t=>t.stop());
});

/* ================= Start ================= */
(async function start(){
  loadSettings();
  document.getElementById('burstBtn').textContent=settings.burstCount+'×';
  await initStream();
  await updateThumb();
})();

})();
</script>
